<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <title>Job Detector - Edit Job Posting</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Miss+Fajardose&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/open-iconic-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.timepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .form-section { padding: 80px 0; background-color: #f8f9fa; }
        .form-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); }
        .form-group label { font-weight: 700; color: #2c3e50; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
        .btn-submit { background-color: #ff6f61; color: white; border: none; padding: 15px 40px; font-weight: 700; border-radius: 5px; transition: 0.3s; }
        .btn-submit:hover { background-color: #e65b50; transform: translateY(-2px); color: white; }
    </style>
</head>
<body>
    {% include 'jobprovider_header.html' %}

    <section class="hero-wrap hero-wrap-2" style="background-image: url('{% static 'images/office_bg.jpg' %}');" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-end justify-content-center">
          <div class="col-md-9 ftco-animate text-center">
            <h1 class="mb-2 bread">Edit Job Posting</h1>
            <p class="breadcrumbs">
                <span class="mr-2"><a href="{% url 'jobprovider_index' %}">Home <i class="ion-ios-arrow-forward"></i></a></span>
                <span class="mr-2"><a href="{% url 'jobprovider_viewjobs' %}">View Jobs <i class="ion-ios-arrow-forward"></i></a></span>
                <span>Edit Job <i class="ion-ios-arrow-forward"></i></span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="form-section">
       <div class="container">
          <div class="row justify-content-center">
             <div class="col-md-8">

                <div class="form-card ftco-animate">
                    <h2 class="mb-4 text-center" style="font-weight: 700; color: #333;">Update Job Details</h2>

                    {% if msg %}
                        <div class="alert alert-danger text-center">{{ msg }}</div>
                    {% endif %}

                    <form method="post" action="">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-4">
                                    <label>Job Title *</label>
                                    <input type="text" name="title" class="form-control" value="{{ job.title }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-4">
                                    <label>Company Name *</label>
                                    <input type="text" name="company_name" class="form-control" value="{{ job.company_name }}" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-4">
                                    <label>Location *</label>
                                    <input type="text" name="location" class="form-control" value="{{ job.location }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-4">
                                    <label>Salary Range</label>
                                    <input type="text" name="salary_range" class="form-control" value="{{ job.salary_range }}">
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label>Job Description *</label>
                            <textarea name="description" rows="5" class="form-control" required>{{ job.description }}</textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label>Requirements</label>
                            <textarea name="requirements" rows="4" class="form-control">{{ job.requirements }}</textarea>
                        </div>

                        <div class="form-group mb-5">
                            <label>Benefits</label>
                            <textarea name="benefits" rows="3" class="form-control">{{ job.benefits }}</textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn-submit shadow-sm w-100">Save Changes</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'jobprovider_viewjobs' %}" class="text-muted small">Cancel and return to View Jobs</a>
                    </div>
                </div>

             </div>
          </div>
       </div>
    </section>

    {% include 'footer.html' %}

    <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/jquery-migrate-3.0.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
    <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
    <script src="{% static 'js/jquery.stellar.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/jquery.animateNumber.min.js' %}"></script>
    <script src="{% static 'js/bootstrap-datepicker.js' %}"></script>
    <script src="{% static 'js/jquery.timepicker.min.js' %}"></script>
    <script src="{% static 'js/scrollax.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
