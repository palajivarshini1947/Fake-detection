<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <title>Job Detector - Customer Registration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Miss+Fajardose&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/open-iconic-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.timepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .hero-wrap-regi {
            height: 400px;
            background-position: center center;
            background-size: cover;
        }
        .text-black { color: #000 !important; font-weight: 600; }
    </style>
</head>

<body>
    {% include 'header.html' %}

    <section class="hero-wrap hero-wrap-2 hero-wrap-regi" style="background-image: url('{% static 'images/office_bg.jpg' %}');" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center" style="height: 400px;">
          <div class="col-md-9 ftco-animate text-center">
            <h1 class="mb-2 bread">Customer Registration</h1>
            <p class="breadcrumbs"><span class="mr-2"><a href="#">Home <i class="ion-ios-arrow-forward"></i></a></span> <span>Register <i class="ion-ios-arrow-forward"></i></span></p>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section contact-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 ftco-animate">
                    <div class="bg-light p-5 contact-form">

                        <h3 class="mb-4 text-center">Create Your Account</h3>

                        {% if msg %}
                        <div class="alert {% if 'Successfully' in msg %}alert-success{% else %}alert-danger{% endif %} text-center">
                            {{ msg }}
                        </div>
                        {% endif %}

                        <form action="" method="post" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="text-black">Full Name</label>
                                        <input type="text" class="form-control" name="name" placeholder="Enter your name" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="text-black">Email Address</label>
                                        <input type="email" class="form-control" name="email" placeholder="email@example.com" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="text-black">Mobile Number</label>
                                        <input type="number" class="form-control" name="mobile" placeholder="Contact number" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="text-black">Pincode</label>
                                        <input type="number" class="form-control" name="pincode" placeholder="6-digit pincode" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="text-black">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="Create a strong password" required>
                            </div>

                            <div class="form-group">
                                <label class="text-black">Address</label>
                                <textarea name="address" cols="30" rows="4" class="form-control" placeholder="Your permanent address" required></textarea>
                            </div>

                            <div class="form-group mt-4 text-center">
                                <input type="submit" value="Register Now" class="btn btn-primary py-3 px-5">
                            </div>

                            <div class="text-center">
                                <p>Already have an account? <a href="{% url 'customer_login' %}">Login here</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {% include 'footer.html' %}

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/jquery-migrate-3.0.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
    <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
    <script src="{% static 'js/jquery.stellar.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/jquery.animateNumber.min.js' %}"></script>
    <script src="{% static 'js/scrollax.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
