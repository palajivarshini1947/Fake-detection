<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <title>Job Detector - Change Admin Password</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/open-iconic-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.timepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .password-section {
            padding: 80px 0;
            background-color: #f8f9fa;
        }
        .form-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }
        .form-group label {
            font-weight: 700;
            color: #2c3e50;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .form-control {
            border: 1px solid #e0e0e0;
            height: 50px;
            border-radius: 5px;
        }
        .btn-update {
            background-color: #275df5; /* JobDetector Primary Blue */
            color: white;
            border: none;
            padding: 15px 40px;
            font-weight: 700;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-update:hover {
            background-color: #1e4bb8; /* Darker blue on hover */
            transform: translateY(-2px);
            color: white;
        }
    </style>
  </head>
  <body>
    {% include 'admin_header.html' %}

    <section class="hero-wrap hero-wrap-2" style="background-image: url('{% static 'images/office_bg.jpg' %}');" data-stellar-background-ratio="0.5">
      <div class="overlay" style="background-color: rgba(39, 93, 245, 0.75);"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-end justify-content-center">
          <div class="col-md-9 ftco-animate text-center pb-5">
            <h1 class="mb-2 bread text-white" style="font-weight: 700;">Change Password</h1>
            <p class="breadcrumbs">
                <span class="mr-2"><a href="{% url 'admin_index' %}" class="text-white">Dashboard <i class="ion-ios-arrow-forward"></i></a></span>
                <span class="text-white-50">Change Password <i class="ion-ios-arrow-forward"></i></span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="password-section">
       <div class="container">
          <div class="row justify-content-center">
             <div class="col-md-6">

                <div class="form-card ftco-animate">
                    <h2 class="mb-4 text-center" style="font-weight: 700; color: #333;">Update Password</h2>

                    {% if msg %}
                        <div class="alert {% if 'Success' in msg %}alert-success{% else %}alert-danger{% endif %} text-center mb-4" style="border-radius: 5px;">
                            {{ msg }}
                        </div>
                    {% endif %}

                    <form method="post" action="">
                        {% csrf_token %}

                        <div class="form-group mb-4">
                            <label>Old Password</label>
                            <input type="password" name="old_password" class="form-control" placeholder="Current password" required>
                        </div>

                        <div class="form-group mb-4">
                            <label>New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
                        </div>

                        <div class="form-group mb-5">
                            <label>Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn-update shadow-sm w-100">Save Changes</button>
                        </div>
                    </form>
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'admin_index' %}" class="text-muted font-weight-bold" style="text-decoration: none;">&larr; Return to Dashboard</a>
                </div>

             </div>
          </div>
       </div>
    </section>

    {% include 'footer.html' %}

  <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#275df5"/></svg></div>

  <script src="{% static 'js/jquery.min.js' %}"></script>
  <script src="{% static 'js/jquery-migrate-3.0.1.min.js' %}"></script>
  <script src="{% static 'js/popper.min.js' %}"></script>
  <script src="{% static 'js/bootstrap.min.js' %}"></script>
  <script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
  <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
  <script src="{% static 'js/jquery.stellar.min.js' %}"></script>
  <script src="{% static 'js/owl.carousel.min.js' %}"></script>
  <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
  <script src="{% static 'js/aos.js' %}"></script>
  <script src="{% static 'js/jquery.animateNumber.min.js' %}"></script>
  <script src="{% static 'js/bootstrap-datepicker.js' %}"></script>
  <script src="{% static 'js/jquery.timepicker.min.js' %}"></script>
  <script src="{% static 'js/scrollax.min.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>

  </body>
</html>
