<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <title>Job Detector - Add Notification</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Miss+Fajardose&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/open-iconic-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.timepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* Ensuring the section is visible and well-spaced */
        .create-notification-section {
            padding: 100px 0;
            background-color: #f8f9fa;
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .form-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #eee;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .form-card-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            font-size: 26px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #ff6f61;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control-custom {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 15px;
            font-size: 14px;
            width: 100%;
            margin-bottom: 25px;
            color: #333;
            background-color: #fafafa;
        }

        .btn-save {
            background-color: #ff6f61;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover {
            background-color: #e65b50;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    {% include 'admin_header.html' %}

    <section class="hero-wrap hero-wrap-2" style="background-image: url('{% static 'images/office_bg.jpg' %}'); height: 350px;">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center" style="height: 350px;">
          <div class="col-md-9 text-center">
            <h1 class="mb-2 bread" style="color: #fff;">Admin Notifications</h1>
            <p class="breadcrumbs"><span class="mr-2"><a href="{% url 'index' %}">Home</a></span> <span>Add Notification</span></p>
          </div>
        </div>
      </div>
    </section>

    <section class="create-notification-section">
       <div class="container">
          <div class="row justify-content-center">
             <div class="col-lg-10">
                <div class="form-card">
                    <h3 class="form-card-title">Compose New Message</h3>
                    {% if messages %}
                    <div class="container mt-3">
                        {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <form method="post" action="">
                       {% csrf_token %}

                       <div class="form-group">
                           <label for="title">Notification Title</label>
                           <input type="text" id="title" name="title" class="form-control-custom" placeholder="e.g. New Special Discount" required>
                       </div>

                       <div class="form-group">
                           <label for="message">Notification Details</label>
                           <textarea id="message" name="message" class="form-control-custom" rows="6" placeholder="Write your message here..." required></textarea>
                       </div>

                       <div class="d-flex justify-content-between align-items-center">
                           <a href="{% url 'index' %}" class="text-muted">Cancel</a>
                           <button type="submit" class="btn-save shadow">Broadcast Notification</button>
                       </div>
                    </form>
                </div>
             </div>
          </div>
       </div>
    </section>

   {% include 'footer.html' %}

    <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/jquery-migrate-3.0.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
    <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
    <script src="{% static 'js/jquery.stellar.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
